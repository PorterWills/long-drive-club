<style>
  /* LDC Design System · The Livery. Ratio green 55 / tarmac 30 / chalk 12 / redline 3. Surfaces opaque, corners square. */
  :root {
    --ldc-green: #0E2A1C; --ldc-tarmac: #1B1916; --ldc-chalk: #EDE9DF; --ldc-redline: #C1121F;
    --ldc-chalk-dim: #CFC9BB; --ldc-green-up: #163826; --ldc-tarmac-up: #262320; --ldc-redline-down: #A30E19;
    --hairline: rgba(237, 233, 223, 0.18); --hairline-strong: rgba(237, 233, 223, 0.34);
    --font: "Archivo", sans-serif; --voice: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ldc-tarmac); color: var(--ldc-chalk);
    font: 400 15px/1.55 var(--font); user-select: none; touch-action: none; }
  canvas { display: block; }
  .display { font-weight: 800; font-variation-settings: "wdth" 122; text-transform: uppercase; letter-spacing: .02em; line-height: 1.04; font-feature-settings: "tnum" 1; }
  .eyebrow { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; font-weight: 600; font-variation-settings: "wdth" 112; color: var(--ldc-chalk-dim); }
  .voice { font-family: var(--voice); font-style: italic; font-weight: 400; }
  .stripe { position: fixed; left: 0; right: 0; height: 10px; display: flex; z-index: 5; pointer-events: none; }
  .stripe i { display: block; } .stripe i:nth-child(1) { flex: 7; background: var(--ldc-green); }
  .stripe i:nth-child(2) { flex: 1.4; background: var(--ldc-chalk); } .stripe i:nth-child(3) { flex: .5; background: var(--ldc-redline); }
  .panel { position: fixed; background: var(--ldc-tarmac); border: 1px solid var(--hairline); padding: 10px 14px; }
  .roundel { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--ldc-chalk); color: var(--ldc-tarmac);
    border: 3px solid var(--ldc-tarmac); box-shadow: 0 0 0 2px var(--ldc-chalk); display: grid; place-items: center; font-size: 12px; }
  #hole { top: 22px; left: 14px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 270px); }
  #hole .name { font-size: 13px; }
  #hole .eyebrow { margin-top: 4px; letter-spacing: .24em; }
  #info { top: 22px; right: 14px; text-align: right; min-width: 150px; }
  #info .num { font-size: 26px; }
  #info .row2 { margin-top: 6px; display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; }
  #info .row2 .num { font-size: 18px; }
  #wind { display: inline-block; transition: transform .2s; font-size: 14px; }
  #aimRead { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--ldc-chalk); }
  #stats { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); cursor: pointer; text-align: left; } /* lives in #info: one line, tap for the rest */
  #stats .sum { color: var(--ldc-chalk); text-align: right; } #stats:not(.open) .r { display: none; } #stats.open .sum { margin-bottom: 4px; }
  #stats div.r { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; line-height: 1.7; }
  #stats div.r span:first-child { color: var(--ldc-chalk-dim); }
  #stats div.r span:last-child { font-weight: 700; font-variation-settings: "wdth" 115; font-feature-settings: "tnum" 1; }
  #controls { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100% - 28px)); }
  .row { display: flex; gap: 2px; margin-bottom: 2px; }
  #club { flex: 1; background: var(--ldc-tarmac); color: var(--ldc-chalk); border: 1px solid var(--hairline); border-radius: 3px; padding: 12px; font: 600 12px var(--font); letter-spacing: .2em; text-transform: uppercase; }
  #swing { width: 140px; background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); border-radius: 3px; font: 800 14px var(--font); font-variation-settings: "wdth" 122; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  #swing:hover:not(:disabled) { background: var(--ldc-green-up); }
  #swing:disabled { background: var(--ldc-tarmac-up); color: var(--ldc-chalk-dim); border-color: var(--hairline); cursor: default; }
  #power { position: relative; height: 46px; border: 1px solid var(--hairline); border-radius: 3px; background: var(--ldc-tarmac); cursor: ew-resize; overflow: hidden; }
  #powerFill { position: absolute; inset: 0; background: var(--ldc-green); border-right: 4px solid var(--ldc-redline); }
  #powerText { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; }
  #hint { text-align: center; margin-top: 8px; color: var(--ldc-chalk); text-shadow: none; }
  #toast { position: fixed; top: 36%; left: 50%; transform: translate(-50%,-50%); background: var(--ldc-tarmac); border: 1px solid var(--hairline); border-top: 4px solid var(--ldc-redline);
    padding: 14px 22px; font-size: 22px; pointer-events: none; opacity: 0; transition: opacity .3s ease-out; white-space: nowrap; }
  #done { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; padding: 0 0 22px; width: min(360px, calc(100% - 28px)); overflow: hidden; }
  #done .stripe { position: static; height: 8px; margin-bottom: 22px; }
  #done .roundel { width: 76px; height: 76px; margin: 0 auto 14px; font-size: 30px; border-width: 5px; box-shadow: 0 0 0 3px var(--ldc-chalk); }
  #done h2 { margin: 0; font-size: 34px; }
  #done .voice { font-size: 19px; margin: 10px 22px 6px; color: var(--ldc-chalk); }
  #done button { margin-top: 16px; background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); padding: 12px 26px; border-radius: 3px; font: 600 14px var(--font); cursor: pointer; }
  #done button:hover { background: var(--ldc-green-up); }
  #holesBtn, .cardBtns button { background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); border-radius: 3px; padding: 8px 12px; font: 600 11px var(--font); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  #holesBtn { margin-top: 8px; padding: 6px 10px; }
  #holesBtn:hover, .cardBtns button:hover { background: var(--ldc-green-up); }
  #card { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(520px, calc(100% - 28px)); max-height: calc(100% - 60px); overflow: hidden auto; padding: 0 0 16px; z-index: 6; }
  #card .stripe { position: static; height: 8px; margin-bottom: 10px; }
  .hrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 36px 44px 34px 56px; gap: 6px; align-items: center; width: 100%; padding: 10px 16px; background: none; border: 0; border-bottom: 1px solid var(--hairline); color: var(--ldc-chalk); font: 400 14px var(--font); text-align: left; cursor: pointer; }
  .hrow span:nth-child(n+3) { text-align: right; font-feature-settings: "tnum" 1; }
  .hrow.head { cursor: default; padding-top: 6px; padding-bottom: 6px; }
  button.hrow:hover { background: var(--ldc-tarmac-up); }
  .hrow.here { background: var(--ldc-green); box-shadow: inset 4px 0 0 var(--ldc-redline); }
  #cardTotal { padding: 12px 16px 0; color: var(--ldc-chalk); }
  .cardBtns { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
  #cardAsk { margin: 12px 16px 0; padding: 12px 0 0; border-top: 4px solid var(--ldc-redline); }
  #cardAsk .cardBtns { padding: 10px 0 0; }
  .cardBtns #askNo, .cardBtns #newRound, .cardBtns #cardClose { background: var(--ldc-tarmac-up); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--ldc-chalk); outline-offset: 2px; }
  @media (max-width: 520px) { #hole .name { font-size: 11px; } .roundel { width: 38px; height: 38px; font-size: 11px; } #info .num { font-size: 22px; }
    #hole { left: 8px; gap: 8px; padding: 8px 10px; max-width: calc(100% - 176px); } #hole .eyebrow { letter-spacing: .12em; }
    #info { right: 8px; min-width: 0; padding: 8px 10px; } #info .eyebrow { letter-spacing: .16em; }
 }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  <div id="hint" class="eyebrow">Set the power · swing</div>
</div>

<script type="module">
import * as THREE from 'three';

// ---------- vectors ----------
const v = (x, y, z) => ({ x, y, z });
const add = (a, b) => v(a.x + b.x, a.y + b.y, a.z + b.z);
const sub = (a, b) => v(a.x - b.x, a.y - b.y, a.z - b.z);
const mul = (a, s) => v(a.x * s, a.y * s, a.z * s);
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const cross = (a, b) => v(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const len = a => Math.hypot(a.x, a.y, a.z);
const norm = a => { const l = len(a); return l > 1e-9 ? mul(a, 1 / l) : v(0, 0, 0); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const YD = 0.9144, MPH = 0.44704, G = 9.81;
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// daily wind: 0–20 mph from any direction, seeded by the UTC date so everyone shares the day's conditions
function dailyWind(date = new Date()) {
  const day = date.toISOString().slice(0, 10), r = rng([...day].reduce((h, ch) => Math.imul(h ^ ch.charCodeAt(0), 16777619), 2166136261));
  return { mph: Math.round(r() * 20), toward_deg: Math.round(r() * 360) };
}

// ---------- hole (our own format) ----------
// Layout traced from an aerial of a famous opening par 4: 445 yd, fairway drifting left then bending right
// to an elevated green, a fairway bunker right, a bunker front-left of the green, tree lines both sides.
// World +x is the player's LEFT (screen-left from behind the ball); z runs from tee to green, in metres.
const HOLES = [{
  name: 'Tee Tree', par: 4, si: 9,
  tee: [0, 0], pin: [-55, 403],                  // 445 yd tee to pin
  wind: dailyWind(),                           // new each day (UTC), the same for every player that day
  fairway: { half_width: 15, line: [[0, 0], [112, -8], [197, 2], [265, -8], [333, -29], [408, -56]] }, // [z, x] centreline
  elevation: [[0, 3], [90, 1.2], [200, -1], [280, 0.5], [345, 4], [400, 6.5], [460, 7.5]],           // [z, height m]
  green: { at: [-56, 405], r: 15 },
  bunkers: [{ at: [-23, 232], r: 5 }, { at: [-26, 248], r: 5.5 }, { at: [-37, 393], r: 3.6 }, { at: [-39, 401], r: 3.4 }],
  water: [],
  trees: [ // [side (+1 left / -1 right), z from, z to, inner offset from centreline, depth]
    [1, 82, 392, 24, 16], [-1, 62, 470, 23, 18],
  ],
  treeClusters: [{ at: [-48, 60], r: 16 }, { at: [-14, 430], r: 14 }, { at: [-62, 452], r: 22 }, { at: [-90, 430], r: 14 }],
  cars: [ // the arrival: parked behind the tee, one by the clubhouse end of the green
    { at: [9, -14], heading: 20, colour: '#C1121F', kind: 'hyper' },   // the one redline car
    { at: [-8, -15], heading: -15, colour: '#EDE9DF', kind: 'gt' },
    { at: [21, -11], heading: 45, colour: '#262320', kind: 'gt' },
    { at: [-80, 404], heading: 80, colour: '#163826', kind: 'hyper' },
  ],
}, {
  // Traced from an aerial of a long downhill par 5: 585 yd, straight down a tree-lined chute, then a hard dogleg
  // left round a stand of trees to a green guarded right and front. Scale 0.337 m/px (535 m over ~1,590 px).
  name: 'Red Catbranch', par: 5, si: 17,
  tee: [0, 0], pin: [164, 509.2],              // 585 yd tee to pin
  wind: dailyWind(),
  fairway: { half_width: 17, line: [[0, 0], [120, -5], [221, -3], [288, -7], [356, 25], [423, 56], [473, 93], [507, 160]] },
  elevation: [[0, 9], [120, 7], [260, 4], [380, 1], [470, -0.5], [520, 0], [580, 0.5]],      // downhill all the way
  green: { at: [165, 507], r: 12 },
  bunkers: [{ at: [-11, 318], r: 4.5 }, { at: [-15, 311], r: 4.5 }, { at: [149, 516], r: 4 }, { at: [148, 507], r: 4 }, { at: [161, 489], r: 4 }],
  water: [],
  trees: [[1, 157, 436, 21, 22], [-1, 15, 477, 21, 22]],
  treeClusters: [{ at: [80, 490], r: 12 }, { at: [133, 561], r: 14 }, { at: [27, 99], r: 8 }, { at: [35, 47], r: 6 }],
  cars: [
    { at: [-9, -14], heading: -20, colour: '#C1121F', kind: 'hyper' },
    { at: [8, -15], heading: 15, colour: '#262320', kind: 'gt' },
    { at: [195, 500], heading: -80, colour: '#EDE9DF', kind: 'gt' },
  ],
}, {
  name: 'Wilting Mango', par: 4, si: 14,
  tee: [0, 0], pin: [8.5, 320],                // 350 yd tee to pin (aerial scale 0.224 m/px)
  wind: dailyWind(),
  fairway: { half_width: 20, line: [[0, 0], [58, -14], [114, 12], [170, 29], [237, 33], [293, 20], [320, 8.5]] },
  elevation: [[0, 2], [150, 1], [250, 3], [330, 5], [380, 5.5]],
  green: { at: [8.5, 320], r: 12 },
  bunkers: [{ at: [43, 237], r: 4 }, { at: [40, 222], r: 4.5 }, { at: [35, 217], r: 4 }, { at: [46, 212], r: 3.5 }, { at: [36, 206], r: 3.5 },
    { at: [31, 320], r: 3.5 }, { at: [32, 313], r: 3.5 }],
  water: [],
  trees: [[1, 255, 354, 34, 20], [-1, 179, 325, 32, 25]],
  treeClusters: [{ at: [46, 114], r: 22 }, { at: [26, 45], r: 18 }, { at: [14, -7], r: 6 }, { at: [-11, 101], r: 11 }, { at: [-16, 163], r: 12 }, { at: [-5, 141], r: 4 }],
  cars: [
    { at: [-10, -12], heading: -15, colour: '#262320', kind: 'gt' },
    { at: [-30, 300], heading: 70, colour: '#C1121F', kind: 'hyper' },
  ],
}, {
  name: 'Blossoming Shrimp Pear', par: 3, si: 3,
  tee: [0, 0], pin: [-4.6, 219.4],             // 240 yd tee to pin (back tee, aerial scale 0.172 m/px)
  wind: dailyWind(),
  fairway: { half_width: 20, line: [[0, 0], [68, 10], [120, 1.4], [171, -2], [219.4, -4.6]] },
  elevation: [[0, 4], [120, 2], [220, 1], [270, 1.5]],
  green: { at: [-4.6, 219.4], r: 13 },
  bunkers: [{ at: [17, 214], r: 4 }, { at: [17, 221], r: 4 }, { at: [-9, 206], r: 4 }, { at: [-15, 211], r: 4 }],
  water: [],
  trees: [[1, 73, 240, 26, 20], [-1, -18, 262, 23, 22]],
  treeClusters: [{ at: [22, -11], r: 10 }, { at: [28, 255], r: 6 }, { at: [-19, 243], r: 10 }],
  cars: [
    { at: [10, -14], heading: 20, colour: '#C1121F', kind: 'hyper' },
    { at: [30, 235], heading: -60, colour: '#EDE9DF', kind: 'gt' },
  ],
}, {
  name: 'Violet', par: 4, si: 5,
  tee: [0, 0], pin: [40.5, 450.8],             // 495 yd tee to pin (back tee, aerial scale 0.319 m/px)
  wind: dailyWind(),
  fairway: { half_width: 22, line: [[0, 0], [84, -7], [180, -20], [276, -26], [355, -14], [403, 15], [450.8, 40.5]] },
  elevation: [[0, 2], [200, 0], [350, 5], [460, 8], [520, 8.5]],
  green: { at: [40.5, 450.8], r: 11 },
  bunkers: [{ at: [56, 462], r: 4 }, { at: [-7, 285], r: 4.5 }, { at: [-11, 264], r: 4.5 }],
  water: [],
  trees: [[1, 78, 282, 30, 20], [-1, -37, 492, 40, 25]],
  treeClusters: [{ at: [33, 339], r: 25 }, { at: [80, 401], r: 12 }, { at: [95, 451], r: 14 }, { at: [31, 508], r: 18 }, { at: [28, 17], r: 10 }, { at: [9, 65], r: 6 }],
  cars: [
    { at: [-10, -14], heading: -20, colour: '#262320', kind: 'gt' },
    { at: [10, 470], heading: 90, colour: '#C1121F', kind: 'hyper' },
  ],
}];
// round: scores kept in this browser (shortcut: localStorage per viewer, move to the leaderboard database when it exists).
// Only the round's next unplayed hole counts; any other hole is practice and never touches the scores.
const ROUND = (() => { try { return JSON.parse(localStorage.getItem('ldc.round')) || { scores: [] }; } catch { return { scores: [] }; } })();
const saveRound = () => { try { localStorage.setItem('ldc.round', JSON.stringify(ROUND)); } catch {} };
const roundHole = () => Math.min(ROUND.scores.length + 1, HOLES.length);
const roundDone = () => ROUND.scores.length >= HOLES.length;
const askedHole = parseInt(new URLSearchParams(location.search).get('hole'));
const HOLE_NO = clamp(askedHole || roundHole(), 1, HOLES.length), HOLE = HOLES[HOLE_NO - 1];
const PRACTICE = roundDone() || HOLE_NO !== roundHole() || new URLSearchParams(location.search).has('practice');
document.title = `Long Drive Club · ${HOLE.name}`;
document.getElementById('holeLabel').textContent = `${PRACTICE ? 'Practice · ' : ''}Hole ${HOLE_NO} · ${HOLE.name} · Par ${HOLE.par}`;
// smooth (cosine) interpolation through [z, value] points
const lerpPts = (pts, z) => {
  if (z <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (z <= pts[i][0]) {
    const [z0, a] = pts[i - 1], [z1, b] = pts[i], t = (1 - Math.cos(Math.PI * (z - z0) / (z1 - z0))) / 2;
    return a + (b - a) * t;
  }
  return pts[pts.length - 1][1];
};
const centreX = z => lerpPts(HOLE.fairway.line, z);
const inCircle = (x, z, c) => Math.hypot(x - c.at[0], z - c.at[1]) < c.r;
const FW_END = HOLE.green.at[1] - HOLE.green.r - 4;
// organic outlines: distance from the centre over a wobbly radius, so < 1 is inside. k scales the wobble (greens wobble less)
const blobD = (c, x, z, seed, k = 1) => {
  const dx = x - c.at[0], dz = z - c.at[1], a = Math.atan2(dz, dx);
  return Math.hypot(dx, dz) / (c.r * (1 + k * (.16 * Math.sin(3 * a + seed) + .09 * Math.sin(5 * a + seed * 1.7) + .05 * Math.sin(7 * a + seed * 2.3))));
};
const bunkerD = (x, z) => Math.min(...HOLE.bunkers.map((b, i) => blobD(b, x, z, i * 2.1 + HOLE_NO)), 9);
const greenD = (x, z) => blobD(HOLE.green, x, z, HOLE_NO * 3.7, .55);
// per-hole green contours: two seeded soft mounds or hollows on top of the shared back-to-front slope
const MOUNDS = (() => { const r = rng(HOLE_NO * 101), g = HOLE.green; return [0, 1].map(() => {
  const a = r() * 6.283, d = r() * g.r * .55; return { x: g.at[0] + Math.cos(a) * d, z: g.at[1] + Math.sin(a) * d, h: (r() - .4) * .4, s2: (g.r * (.3 + r() * .15)) ** 2 }; }); })();

function materialAt(x, z) {
  if (HOLE.water.some(w => inCircle(x, z, w))) return 'water';
  if (bunkerD(x, z) < 1) return 'sand';
  const g = greenD(x, z);
  if (g < 1) return 'green';
  if (g < 1 + 2 / HOLE.green.r) return 'fringe';
  if (Math.abs(x - HOLE.tee[0]) < 6 && Math.abs(z - HOLE.tee[1]) < 9) return 'fairway';
  const off = Math.abs(x - centreX(z));
  if (z > 30 && z < FW_END && off < HOLE.fairway.half_width) return 'fairway';
  if (z > 30 && z < FW_END && off < HOLE.fairway.half_width + 3) return 'firstcut';

const GZ = HOLE.green.at[1];

function heightAt(x, z) {
  let h = lerpPts(HOLE.elevation, z);                                   // tee high, valley at the landing area, climb to the green
  h += 0.6 * Math.sin(x * 0.045 + 1) * Math.cos(z * 0.021) + 0.4 * Math.sin(z * 0.013 + x * 0.01);
  const off = Math.abs(x - centreX(Math.min(z, GZ)));

  const [gx, gz] = HOLE.green.at, g = Math.hypot(x - gx, z - gz), core = Math.exp(-(g * g) / 400);
  h += 0.7 * core + (z - gz) * 0.03 * core + (x - gx) * 0.008 * core;   // raised green, strong back-to-front slope
  for (const m of MOUNDS) h += m.h * Math.exp(-((x - m.x) ** 2 + (z - m.z) ** 2) / m.s2);
  const bd = bunkerD(x, z), t = clamp((1 - bd) / .3, 0, 1);
  h += bd < 1 ? -0.75 * t * t * (3 - 2 * t) : bd < 1.25 ? 0.22 * Math.sin(Math.PI * (bd - 1) / .25) : 0; // flat floor, steep face, grass lip

}

// tree positions: seeded, generated once, used for drawing and for trunk and canopy collisions
const TREES = (() => {
  const r = rng(1934), pr = rng(7), out = [], nearCar = (x, z) => HOLE.cars.some(c => Math.hypot(x - c.at[0], z - c.at[1]) < 5);

  const add = (x, z) => { if (!nearCar(x, z) && !nearPlay(x, z)) out.push({ x, z, s: .8 + r() * .7, pine: pr() < .6, h: heightAt(x, z) }); };
  for (const [side, z0, z1, inner, depth] of HOLE.trees)
    for (let z = z0; z < z1; z += 3.2) for (let k = 0; k < 2; k++) add(centreX(Math.min(z, GZ)) + side * (inner + r() * depth), z + r() * 3);

})();

const BALL = { m: 0.04593, r: 0.021335 };

  fringe:   { bounce: .34, keep: .53, roll: .21, grip: .85, snag: 0 },

  fringe: { speed: .99, spin: .96, launch: .2, spread: 1.1 }, firstcut: { speed: .95, spin: .82, launch: .8, spread: 1.5 },
  rough: { speed: .86, spin: .62, launch: 1.6, spread: 2.4 }, sand: { speed: .6, spin: .55, launch: 4, spread: 3.4 },

const CLUBS = [
  { id: 'dr', name: 'Driver',  speed: 74.9, launch: 10.9, spin: 2700 },
  { id: '3w', name: '3 Wood',  speed: 68.1, launch: 9.2,  spin: 3650 },

// air: gravity + drag + Magnus lift, all from velocity relative to the wind
function accel(vel, spin, wind) {
  const rel = sub(vel, wind), s = len(rel);
  if (s < 1e-6) return v(0, -G, 0);
  const w = len(spin), ratio = clamp(w * BALL.r / s, 0, 0.5);
  const cd = clamp(0.21 + 0.33 * ratio, 0.2, 0.45), cl = Math.min(0.33, 0.6 * Math.pow(ratio, 0.55));
  const q = 0.5 * RHO * AREA * s * s / BALL.m;
  let a = add(v(0, -G, 0), mul(rel, -cd * q / s));
  if (w > 1e-6) a = add(a, mul(norm(cross(spin, rel)), cl * q));
  return a;
}
function rk4(p, vel, spin, wind) {
  const k1v = accel(vel, spin, wind), k1p = vel;
  const v2 = add(vel, mul(k1v, DT / 2)), k2v = accel(v2, spin, wind);
  const v3 = add(vel, mul(k2v, DT / 2)), k3v = accel(v3, spin, wind);
  const v4 = add(vel, mul(k3v, DT)), k4v = accel(v4, spin, wind);
  const dv = mul(add(add(k1v, mul(k2v, 2)), add(mul(k3v, 2), k4v)), DT / 6);
  const dp = mul(add(add(k1p, mul(v2, 2)), add(mul(v3, 2), v4)), DT / 6);
  return [add(p, dp), add(vel, dv)];
}

// cars collide as a pair of upright cylinders along their length
// shortcut: cylinders, not true box shapes; upgrade if balls visibly pass through bumpers
const CAR_COLLIDERS = HOLE.cars.flatMap(c => {
  const h = c.heading * Math.PI / 180, dx = Math.sin(h) * 1.1, dz = Math.cos(h) * 1.1;
  return [-1, 1].map(s => ({ x: c.at[0] + dx * s, z: c.at[1] + dz * s, r: 1.05, top: heightAt(c.at[0], c.at[1]) + 1.25 }));
}).concat(TREES.map(t => ({ x: t.x, z: t.z, r: 0.45 * t.s, top: heightAt(t.x, t.z) + 3 * t.s })),
  { x: HOLE.pin[0], z: HOLE.pin[1], r: 0.0095, top: heightAt(...HOLE.pin) + 2.4, low: heightAt(...HOLE.pin) + 0.1 }); // flagstick; below the lip putts still drop
// canopies match the drawn shapes: pines a cone from 3.4s to 12.1s up, broadleaf a ball of 2.4s at 4.6s
function inCanopy(p) {
  for (const t of TREES) {
    const dx = p.x - t.x, dz = p.z - t.z, y = p.y - t.h, s = t.s;
    if (dx * dx + dz * dz > 7 * s * s) continue;
    if (t.pine ? y > 3.4 * s && y < 12.1 * s && Math.hypot(dx, dz) < 2.4 * s * (12.1 * s - y) / (8.7 * s)

  }

}

    return { p: add(v(c.x, p.y, c.z), mul(n, c.r + BALL.r + 0.01)), vel: mul(sub(vel, mul(n, 1.55 * vn)), 0.7) };

// ball launch from club + power + aim + lie. Full power is clean from a good lie;
// only bad lies (rough, sand) add seeded wobble, growing with power.
function strike(club, power, aim, lie, rand) {
  const L = LIE[lie] || LIE.fairway, putt = !!club.putter;
  const pm = putt ? power : 0.35 + 0.65 * power;
  let aimErr = 0, speedMul = 1;
  if (!putt && L.spread > 1.2) {
    const risk = power * power * (L.spread - 1);
    aimErr = (rand() * 2 - 1) * 0.012 * risk;
    speedMul = 1 + (rand() * 2 - 1) * 0.02 * risk;
  }
  const speed = club.speed * pm * (putt ? 1 : L.speed) * speedMul;
  const launch = (club.launch + (putt ? 0 : L.launch)) * Math.PI / 180;
  const rpm = club.spin * pm * (putt ? 1 : L.spin);
  const a = aim + aimErr, dir = v(Math.sin(a), 0, Math.cos(a));
  const vel = v(dir.x * Math.cos(launch) * speed, Math.sin(launch) * speed, dir.z * Math.cos(launch) * speed);
  const spin = mul(norm(cross(dir, v(0, 1, 0))), rpm * 2 * Math.PI / 60); // backspin axis gives lift
  return { vel, spin, speed, launchDeg: launch * 180 / Math.PI, rpm };

function simulate(start, shot, wind, opts = {}) {

    const m = materialAt(p.x, p.z);
    if (m === 'water') return finish('water');

const windVec = (mph, deg) => { const r = deg * Math.PI / 180; return v(Math.sin(r) * mph * MPH, 0, Math.cos(r) * mph * MPH); };
const flat = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// putter: preset speed so the ball rolls the distance on a green (v^2 = 2·mu·g·d), plus a little extra
function puttPower(from, pin) {
  // v² = 2g(μ·d + Δh): friction over the distance plus the climb (negative downhill), as Golf Slate's preset does
  const d = flat(from, pin) + 0.4, dh = heightAt(pin.x, pin.z) - heightAt(from.x, from.z);
  return clamp(Math.sqrt(Math.max(0.05, 2 * G * (SURF.green.roll * d + dh))) / CLUBS[7].speed, 0.01, 1);
}

const PIN = v(HOLE.pin[0], heightAt(HOLE.pin[0], HOLE.pin[1]), HOLE.pin[1]);
const WIND = windVec(HOLE.wind.mph, HOLE.wind.toward_deg);
const state = { ball: null, aim: 0, autoAim: 0, power: 1, club: 0, strokes: 0, phase: 'aim', shot: null, seed: 20261028 };

// carry yards per club at full power, calm, from the fairway (used for suggestions and power readout)
// carry yards per club, lie and power (simulated in still air, interpolated in 10% steps)
const CARRY = {};
const carryAt = (ci, power, lie) => {
  const c = CLUBS[ci]; if (c.putter) return 0;
  const key = `${ci}|${lie}`;
  CARRY[key] ??= Array.from({ length: 11 }, (_, k) => { // flight over flat ground: until the ball drops back to launch height
    const s = strike(c, Math.max(0.01, k / 10), 0, lie, () => .5);
    let p = v(0, 0, 0), vel = s.vel;
    for (let n = 0; n < 2400 && !(vel.y < 0 && p.y <= 0); n++) [p, vel] = rk4(p, vel, s.spin, v(0, 0, 0));
    return Math.hypot(p.x, p.z) / YD;

  for (let s = 0; s < 80; s += 2) {
    const k = s / Math.max(1, flat(p, from)), x = p.x + (from.x - p.x) * k, z = p.z + (from.z - p.z) * k;
    if (materialAt(x, z) !== 'water') return v(x, heightAt(x, z) + BALL.r, z);
  }
  return { ...from };
}
function reset() {
  state.dropT0 = null;
  state.ball = v(HOLE.tee[0], heightAt(...HOLE.tee) + BALL.r, HOLE.tee[1]);
  state.strokes = 0; state.phase = 'aim'; state.seed = (Math.random() * 1e9) | 0;
  $('done').style.display = 'none'; $('stats').style.display = 'none';
  trail.geometry.setFromPoints([]);
  setClub(suggestClub(flat(state.ball, PIN) / YD));
}

// input: drag to aim, power bar, buttons, keys
let dragX = null;
renderer.domElement.addEventListener('pointerdown', e => { if (state.phase === 'aim') { dragX = e.clientX; renderer.domElement.setPointerCapture(e.pointerId); } });
renderer.domElement.addEventListener('pointermove', e => { if (dragX === null || state.phase !== 'aim') return; state.aim += (e.clientX - dragX) * 0.0011 /* drag right swings the aim left */; dragX = e.clientX; refresh(); });
const endDrag = () => dragX = null;
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => renderer.domElement.addEventListener(t, endDrag));
let powering = false;
const setPowerFromX = x => { const r = $('power').getBoundingClientRect(); state.power = clamp((x - r.left) / r.width, 0.01, 1); refresh(); };
$('power').addEventListener('pointerdown', e => { if (state.phase !== 'aim') return; powering = true; $('power').setPointerCapture(e.pointerId); setPowerFromX(e.clientX); });
$('power').addEventListener('pointermove', e => powering && setPowerFromX(e.clientX));
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => $('power').addEventListener(t, () => powering = false));
$('swing').onclick = swing;
$('club').onchange = e => setClub(+e.target.value);
$('again').onclick = reset;
// always navigate (setting an unchanged location.search doesn't reload); no ?hole = the round's next hole
const go = (q = '') => { location.href = location.pathname + q; };
$('next').onclick = () => roundDone() ? openCard() : go();
// holes panel: the card, round scores, practice any hole
const toPar = n => n === 0 ? 'E' : (n > 0 ? `+${n}` : `${n}`);
function roundTotal() {
  const n = ROUND.scores.length, sc = ROUND.scores.reduce((a, b) => a + b, 0), par = HOLES.slice(0, n).reduce((a, h) => a + h.par, 0);
  return n ? `${sc} (${toPar(sc - par)}) after ${n}` : 'Not started';
}
function openCard() {
  $('cardRows').innerHTML = HOLES.map((h, i) => {
    const no = i + 1, sc = ROUND.scores[i], here = no === HOLE_NO;
    return `<button class="hrow${here ? ' here' : ''}" data-hole="${no}"><span class="display">${no}</span><span>${h.name}</span>` +
      `<span>${h.par}</span><span>${Math.round(Math.hypot(h.pin[0] - h.tee[0], h.pin[1] - h.tee[1]) / YD)}</span><span>${h.si}</span>` +
      `<span class="display">${sc ?? (no === roundHole() && !roundDone() ? '·' : '')}</span></button>`;
  }).join('');
  $('cardTotal').textContent = `Round · ${roundTotal()}`;
  $('resume').hidden = !PRACTICE || roundDone();
  $('resume').textContent = `Back to round · Hole ${roundHole()}`;
  $('card').style.display = 'block';
}
$('holesBtn').onclick = openCard;
$('cardClose').onclick = () => { $('card').style.display = 'none'; $('cardAsk').hidden = true; };
// in-card confirm: browser confirm() is blocked in some embeds and silently answers no
let askYes = null;
const ask = (text, yes) => { $('askText').textContent = text; askYes = yes; $('cardAsk').hidden = false; };
$('askYes').onclick = () => askYes();
$('askNo').onclick = () => { $('cardAsk').hidden = true; };
$('resume').onclick = () => go();
const newRound = () => { ROUND.scores = []; saveRound(); go(); };
$('newRound').onclick = () => ROUND.scores.length ? ask('Start a new round? This clears your scorecard.', newRound) : newRound();
$('cardRows').onclick = e => {
  const no = +e.target.closest('.hrow')?.dataset.hole;
  if (!no) return;
  if (no === HOLE_NO) return $('cardClose').onclick();
  if (no === roundHole() && !roundDone()) return go();
  ask(`Practise hole ${no}? It won't count towards your round.`, () => go(`?hole=${no}&practice`));
};
addEventListener('keydown', e => {
  if (state.phase === 'done' && e.key === 'Enter') return reset();
  if (state.phase !== 'aim') return;
  const fine = e.shiftKey ? 0.2 : 1;
  if (e.key === 'ArrowLeft') state.aim += 0.004 * fine;
  else if (e.key === 'ArrowRight') state.aim -= 0.004 * fine;
  else if (e.key === 'ArrowUp') state.power = Math.min(1, state.power + 0.02);
  else if (e.key === 'ArrowDown') state.power = Math.max(0.01, state.power - 0.02);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); return swing(); }
  else if (e.key >= '1' && e.key <= '8') return setClub(+e.key - 1);
  else return;
  e.preventDefault(); refresh();
});

// ---------- loop ----------
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  let ball = state.ball;
  if (state.phase === 'settle') ball = state.shot.r.pts[state.shot.r.pts.length - 1]; // ball has stopped; state.ball still holds the old lie until endShot
  if (state.phase === 'flying') {
    const sh = state.shot, i = clamp(Math.floor((now - sh.t0) / 1000 * 120 * 1.15), 0, sh.r.pts.length - 1); // rAF's now can be a hair before t0
    ball = sh.r.pts[i];
    trail.geometry.setFromPoints(sh.r.pts.slice(0, i + 1).filter((_, k) => k % 3 === 0).map(p => new THREE.Vector3(p.x, p.y, p.z)));
    if (i >= sh.r.pts.length - 1 && now - sh.t0 > 400) { state.phase = 'settle'; setTimeout(endShot, 700); if (sh.r.outcome === 'holed') state.dropT0 = now; }
  }
  const bs = BALL_NEAR + (1 - BALL_NEAR) * clamp((flat(ball, PIN) - 20) / 20, 0, 1); // true size near the cup so what you see is what drops; eases by distance only so it never pops mid-roll
  ballMesh.scale.setScalar(bs); ballMesh.position.set(ball.x, ball.y - BALL.r + 0.08 * bs + 0.005, ball.z);
  if (state.dropT0) { // holed: fall under gravity to the cup floor, with a small settle bounce
    const t = (now - state.dropT0) / 1000, fall = Math.min(CUP_D, 4.9 * t * t), bounce = t > .14 ? Math.abs(Math.sin((t - .14) * 18)) * .015 * Math.max(0, 1 - (t - .14) * 4) : 0;
    cupBall.position.set(PIN.x, CUP_Y + BALL.r - fall + bounce, PIN.z);
  }
  cupBall.visible = !!state.dropT0; ballMesh.visible = !state.dropT0;
  const aim = state.aim; // stays on the line you hit until the next shot is set up, so the camera never lurches toward the pin
  // one framing for aiming, flight and settling: the camera just follows the ball, so it never zooms out and back in
  const putting = CLUBS[state.club].putter;
  const back = putting ? 3.2 : 10, up = putting ? 1.3 : 3.8; // putting sits low and close: ball and cup are drawn true size
  const cx = ball.x - Math.sin(aim) * back, cz = ball.z - Math.cos(aim) * back;
  const target = new THREE.Vector3(cx, Math.max(ball.y + up, heightAt(cx, cz) + 1.5), cz);
  // always look ahead along the line, so the view doesn't snap between "down the fairway" and "at the ball"
  // aim point a few metres past the ball puts the ball ~60% down the screen, clear of the controls (55° vertical FOV)
  const ahead = putting ? 1.6 : 5.6;
  const look = new THREE.Vector3(ball.x + Math.sin(aim) * ahead, ball.y, ball.z + Math.cos(aim) * ahead);
  camPos.lerp(target, 0.08); camLook.lerp(look, 0.12);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(ball.x + LIGHT.dir.x * 250, ball.y + LIGHT.dir.y * 250, ball.z + LIGHT.dir.z * 250); sun.target.position.set(ball.x, ball.y, ball.z);
  sky.position.copy(camera.position); sky.material.uniforms.time.value = now / 1000;
  if (greenLines.visible) greenLines.tick(now);
  cloth.rotation.y = HOLE.wind.toward_deg * Math.PI / 180 - Math.PI / 2 + Math.sin(now / 300) * 0.1;
  { const a = clothGeo.attributes.position, flap = .02 + HOLE.wind.mph * .003; // ripple grows toward the free edge and with the wind
    for (let i = 0; i < a.count; i++) { const x = clothX[i * 3]; a.setZ(i, Math.sin(x * 9 - now / 140) * flap * x / .8); }
    a.needsUpdate = true; clothGeo.computeVertexNormals(); }
  renderer.render(scene, camera);
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  // portrait phones: widen the view (up to 80°) so it isn't a narrow slit; landscape/desktop stay at the signed-off 55°
  camera.fov = Math.max(55, Math.min(80, 2 * Math.atan(Math.tan(Math.PI / 6) / camera.aspect) * 180 / Math.PI));
  camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
reset();
camPos.set(state.ball.x, state.ball.y + 4, state.ball.z - 12); camLook.set(PIN.x, 0, PIN.z);
requestAnimationFrame(frame);
</script>
