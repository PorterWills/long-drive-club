<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Game Mode</title>
<link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* LDC Design System · The Livery. Ratio green 55 / tarmac 30 / chalk 12 / redline 3. Surfaces opaque, corners square. */
  :root {
    --ldc-green: #0E2A1C; --ldc-tarmac: #1B1916; --ldc-chalk: #EDE9DF; --ldc-redline: #C1121F;
    --ldc-chalk-dim: #CFC9BB; --ldc-green-up: #163826; --ldc-tarmac-up: #262320; --ldc-redline-down: #A30E19;
    --hairline: rgba(237, 233, 223, 0.18); --hairline-strong: rgba(237, 233, 223, 0.34);
    --font: "Archivo", sans-serif; --voice: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ldc-tarmac); color: var(--ldc-chalk);
    font: 400 15px/1.55 var(--font); user-select: none; touch-action: none; }
  canvas { display: block; }
  .display { font-weight: 800; font-variation-settings: "wdth" 122; text-transform: uppercase; letter-spacing: .02em; line-height: 1.04; font-feature-settings: "tnum" 1; }
  .eyebrow { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; font-weight: 600; font-variation-settings: "wdth" 112; color: var(--ldc-chalk-dim); }
  .voice { font-family: var(--voice); font-style: italic; font-weight: 400; }
  .stripe { position: fixed; left: 0; right: 0; height: 10px; display: flex; z-index: 5; pointer-events: none; }
  .stripe i { display: block; } .stripe i:nth-child(1) { flex: 7; background: var(--ldc-green); }
  .stripe i:nth-child(2) { flex: 1.4; background: var(--ldc-chalk); } .stripe i:nth-child(3) { flex: .5; background: var(--ldc-redline); }
  .panel { position: fixed; background: var(--ldc-tarmac); border: 1px solid var(--hairline); padding: 10px 14px; }
  .roundel { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--ldc-chalk); color: var(--ldc-tarmac);
    border: 3px solid var(--ldc-tarmac); box-shadow: 0 0 0 2px var(--ldc-chalk); display: grid; place-items: center; font-size: 12px; }
  #hole { top: 22px; left: 14px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 270px); }
  #hole .name { font-size: 13px; }
  #hole .eyebrow { margin-top: 4px; letter-spacing: .24em; }
  #info { top: 22px; right: 14px; text-align: right; min-width: 150px; }
  #info .num { font-size: 26px; }
  #info .row2 { margin-top: 6px; display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; }
  #info .row2 .num { font-size: 18px; }
  #wind { display: inline-block; transition: transform .2s; font-size: 14px; }
  #aimRead { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--ldc-chalk); }
  #stats { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); cursor: pointer; text-align: left; } /* lives in #info: one line, tap for the rest */
  #stats .sum { color: var(--ldc-chalk); text-align: right; } #stats:not(.open) .r { display: none; } #stats.open .sum { margin-bottom: 4px; }
  #stats div.r { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; line-height: 1.7; }
  #stats div.r span:first-child { color: var(--ldc-chalk-dim); }
  #stats div.r span:last-child { font-weight: 700; font-variation-settings: "wdth" 115; font-feature-settings: "tnum" 1; }
  #controls { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100% - 28px)); }
  .row { display: flex; gap: 2px; margin-bottom: 2px; }
  #club { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--ldc-tarmac); color: var(--ldc-chalk); border: 1px solid var(--hairline); border-radius: 3px; padding: 6px 12px; font: 600 12px var(--font); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; text-align: left; }
  #club:hover { background: var(--ldc-tarmac-up); } #club svg { width: 30px; height: 30px; flex: none; } #club .more { margin-left: auto; color: var(--ldc-chalk-dim); }
  #bag { display: none; position: absolute; bottom: calc(100% + 2px); left: 0; right: 0; background: var(--ldc-tarmac); border: 1px solid var(--hairline); border-top: 4px solid var(--ldc-redline); padding: 10px; }
  #bag.open { display: block; } #bag .eyebrow { margin: 0 2px 8px; }
  #bag .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  #bag button { display: grid; justify-items: center; gap: 2px; background: var(--ldc-tarmac-up); color: var(--ldc-chalk); border: 1px solid var(--hairline); border-radius: 3px; padding: 8px 2px; font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; position: relative; }
  #bag button:hover { border-color: var(--hairline-strong); } #bag button svg { width: 40px; height: 40px; }
  #bag button.on { background: var(--ldc-green); border-color: var(--ldc-chalk); }
  #bag button .yd { color: var(--ldc-chalk-dim); font-feature-settings: "tnum" 1; }
  #bag button.on::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: var(--ldc-redline); } /* the club in hand */
  #swing { width: 140px; background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); border-radius: 3px; font: 800 14px var(--font); font-variation-settings: "wdth" 122; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  #swing:hover:not(:disabled) { background: var(--ldc-green-up); }
  #swing:disabled { background: var(--ldc-tarmac-up); color: var(--ldc-chalk-dim); border-color: var(--hairline); cursor: default; }
  #power { position: relative; height: 46px; border: 1px solid var(--hairline); border-radius: 3px; background: var(--ldc-tarmac); cursor: ew-resize; overflow: hidden; }
  #powerFill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--ldc-green) 0 78.65%, var(--ldc-chalk) 78.65% 94.38%, var(--ldc-redline) 94.38%); border-right: 4px solid var(--ldc-redline); } /* owner: the livery stripe as the bar (green 7 : chalk 1.4 : redline .5, hard edges, same as .stripe), revealed as power rises */
  #powerText { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; } /* centred over the green part of the livery, so chalk reads */
  #hint { text-align: center; margin-top: 8px; color: var(--ldc-chalk); text-shadow: none; }
  #toast { position: fixed; top: 36%; left: 50%; transform: translate(-50%,-50%); background: var(--ldc-tarmac); border: 1px solid var(--hairline); border-top: 4px solid var(--ldc-redline);
    padding: 14px 22px; font-size: 22px; pointer-events: none; opacity: 0; transition: opacity .3s ease-out; white-space: nowrap; }
  #done, #water { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; padding: 0 0 22px; width: min(360px, calc(100% - 28px)); overflow: hidden; }
  #done .stripe, #water .stripe { position: static; height: 8px; margin-bottom: 22px; }
  #done .roundel { width: 76px; height: 76px; margin: 0 auto 14px; font-size: 30px; border-width: 5px; box-shadow: 0 0 0 3px var(--ldc-chalk); }
  #done h2, #water h2 { margin: 0; padding: 0 24px; font-size: 26px; line-height: 1.15; }
  #done .voice, #water .voice { font-size: 18px; margin: 12px 28px 8px; color: var(--ldc-chalk); }
  #done button, #water button { margin-top: 16px; background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); padding: 12px 26px; border-radius: 3px; font: 600 14px var(--font); cursor: pointer; }
  #done button:hover, #water button:hover { background: var(--ldc-green-up); }
  #holesBtn, .cardBtns button { background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); border-radius: 3px; padding: 8px 12px; font: 600 11px var(--font); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  #holesBtn { margin-top: 8px; padding: 6px 10px; }
  #holesBtn:hover, .cardBtns button:hover { background: var(--ldc-green-up); }
  #start { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(460px, calc(100% - 28px)); padding: 0 0 20px; z-index: 7; text-align: center; }
  #start.open { display: block; } #start .stripe { position: static; height: 8px; margin-bottom: 20px; }
  #start .roundel { width: 64px; height: 64px; margin: 0 auto 12px; font-size: 22px; }
  #start h2 { margin: 0 0 4px; font-size: 22px; } #start .eyebrow { margin: 14px 16px 10px; }
  #skies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 16px; }
  #skies button { position: relative; display: grid; gap: 8px; padding: 0 0 10px; background: var(--ldc-tarmac-up); color: var(--ldc-chalk); border: 1px solid var(--hairline); border-radius: 3px; font: 600 11px var(--font); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; overflow: hidden; }
  #skies button.on { background: var(--ldc-green); border-color: var(--ldc-chalk); }
  #skies button.on::after { content: ''; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; background: var(--ldc-redline); }
  #skies .sw { display: grid; grid-template-rows: 2fr 1fr 1fr; height: 64px; } /* the sky in three bands: zenith, mid, horizon */
  #play { margin-top: 18px; background: var(--ldc-green); color: var(--ldc-chalk); border: 1px solid var(--hairline-strong); padding: 12px 40px; border-radius: 3px; font: 800 14px var(--font); font-variation-settings: "wdth" 122; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  #play:hover { background: var(--ldc-green-up); }
  #card { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(520px, calc(100% - 28px)); max-height: calc(100% - 60px); overflow: hidden auto; padding: 0 0 16px; z-index: 6; }
  #card .stripe { position: static; height: 8px; margin-bottom: 0; }
  #card > .cardBtns { padding-top: 12px; }
  .hrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 36px 44px 34px 56px; gap: 6px; align-items: center; width: 100%; padding: 7px 16px; background: none; border: 0; border-bottom: 1px solid var(--hairline); color: var(--ldc-chalk); font: 400 14px var(--font); text-align: left; cursor: pointer; }
  .hrow span:nth-child(n+3) { text-align: right; font-feature-settings: "tnum" 1; }
  .hrow.head { cursor: default; padding-top: 6px; padding-bottom: 6px; }
  button.hrow:hover { background: var(--ldc-tarmac-up); }
  .hrow.here { background: var(--ldc-green); box-shadow: inset 4px 0 0 var(--ldc-redline); }
  #cardTotal { padding: 12px 16px 8px; color: var(--ldc-chalk); }
  /* the round's scorecard: printed card stock (Chalk) with Racing Green ink */
  #sc { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(560px, calc(100% - 20px)); max-height: calc(100% - 30px); overflow: hidden auto; z-index: 8; background: var(--ldc-chalk); color: var(--ldc-green); padding: 0 0 18px; }
  #sc .stripe { position: static; height: 8px; }
  #scrim { display: none; position: fixed; inset: 0; z-index: 7; background: rgba(27,25,22,.72); } /* dims the course so the card has the stage */
  .scHead { display: flex; gap: 14px; align-items: center; padding: 16px 16px 10px; }
  .scHead .roundel { width: 54px; height: 54px; background: var(--ldc-green); color: var(--ldc-chalk); border-color: var(--ldc-green); }
  .scHead h2 { margin: 2px 0; font-size: 26px; }
  #sc .eyebrow { color: var(--ldc-green); }
  .scWrap { padding: 0 16px; margin-bottom: 10px; overflow-x: auto; }
  #sc table { width: 100%; border-collapse: collapse; font: 400 12px var(--font); font-feature-settings: "tnum" 1; }
  #sc th, #sc td { border: 1px solid var(--ldc-green); padding: 5px 2px; text-align: center; min-width: 24px; }
  #sc th:first-child, #sc td:first-child { text-align: left; padding-left: 6px; font: 600 11px var(--font); letter-spacing: .12em; text-transform: uppercase; min-width: 44px; }
  #sc tr.hn th { background: var(--ldc-green); color: var(--ldc-chalk); font: 800 12px Archivo, var(--font); }
  #sc tr.me td { font: 800 14px Archivo, var(--font); height: 30px; }
  #sc .sum { background: rgba(14,42,28,.08); font-weight: 700; }
  .m { display: inline-grid; place-items: center; min-width: 19px; height: 19px; font-size: 12px; }
  .m.b, .m.e { border: 1.5px solid var(--ldc-redline); border-radius: 50%; }
  .m.e { box-shadow: 0 0 0 2px var(--ldc-chalk), 0 0 0 3.5px var(--ldc-redline); }
  .m.o, .m.d { border: 1.5px solid var(--ldc-green); }
  .m.d { box-shadow: 0 0 0 2px var(--ldc-chalk), 0 0 0 3.5px var(--ldc-green); }
  .scKey .m { min-width: 9px; height: 9px; margin: 0 7px 0 16px; vertical-align: -1px; } .scKey .m:first-child { margin-left: 0; } .scKey .m.e, .scKey .m.d { margin: 0 11px 0 20px; } /* the outer ring needs its own room */
  .scKey { padding: 0 16px; }
  .scTotal { display: flex; align-items: baseline; gap: 12px; padding: 4px 16px 10px; border-top: 4px solid var(--ldc-redline); margin: 6px 16px 10px; padding-left: 0; }
  .scTotal .display { font-size: 40px; }
  .scTotal .voice { font-size: 18px; color: var(--ldc-green); white-space: nowrap; }
  @media (max-width: 520px) { /* phones: the whole nine fits without sideways scrolling */
    .scWrap { padding: 0 10px; } #sc table { font-size: 10px; } #sc th, #sc td { padding: 4px 0; min-width: 0; }
    #sc th:first-child, #sc td:first-child { min-width: 0; padding-left: 3px; font-size: 9px; letter-spacing: .04em; }
    #sc tr.me td { font-size: 12px; } .m { min-width: 16px; height: 16px; font-size: 10px; } }
  #sc.board .scWrap, #sc.board .scTotal, #sc.board .scKey { display: none; }
  #scBoard { display: none; padding: 0 16px; } #sc.board #scBoard { display: block; }
  #scBoard ol { list-style: none; margin: 0; padding: 0; } #scBoard li { display: grid; grid-template-columns: 30px 1fr 44px 44px; gap: 6px; padding: 8px 4px; border-bottom: 1px solid rgba(14,42,28,.25); font: 400 14px var(--font); }
  #scBoard li b { font: 800 14px Archivo, var(--font); text-align: right; } #scBoard li span:last-child { text-align: right; }
  #scBoard li.me { background: var(--ldc-green); color: var(--ldc-chalk); }
  #scForm { display: grid; gap: 6px; padding: 10px 16px 0; } #scForm[hidden] { display: none; }
  #scForm input { font: 400 16px var(--font); padding: 10px; border: 1px solid var(--ldc-green); border-radius: 3px; background: #F6F3EC; color: var(--ldc-tarmac); }
  #scForm button { justify-self: start; margin-top: 6px; }
  #scMsg { margin: 10px 16px 0; font-size: 17px; color: var(--ldc-green); }
  #sc button.alt { background: transparent; color: var(--ldc-green); box-shadow: inset 0 0 0 1px var(--ldc-green); }
  .scBtns { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 0; }
  .scBtns button, #scForm button { background: var(--ldc-green); color: var(--ldc-chalk); border: 0; border-radius: 3px; padding: 12px 20px; font: 600 12px var(--font); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  .scBtns button:hover { background: var(--ldc-green-up); }
  .hrow.pick { background: var(--ldc-green-up); box-shadow: inset 4px 0 0 var(--ldc-chalk); }
  .hrow .go { grid-column: 3 / -1; text-align: right; font: 600 11px var(--font); letter-spacing: .2em; text-transform: uppercase; }
  .cardBtns { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
  #cardAsk { margin: 12px 16px 0; padding: 12px 0 0; border-top: 4px solid var(--ldc-redline); }
  #cardAsk .cardBtns { padding: 10px 0 0; }
  .cardBtns #askNo, .cardBtns #newRound, .cardBtns #lightBtn, .cardBtns #scBtn, .cardBtns #cardClose { background: var(--ldc-tarmac-up); }
  button:focus-visible { outline: 2px solid var(--ldc-chalk); outline-offset: 2px; }
  @media (max-width: 520px) { #hole .name { font-size: 11px; } .roundel { width: 38px; height: 38px; font-size: 11px; } #info .num { font-size: 22px; }
    #hole { left: 8px; gap: 8px; padding: 8px 10px; max-width: calc(100% - 176px); } #hole .eyebrow { letter-spacing: .12em; }
    #info { right: 8px; min-width: 0; padding: 8px 10px; } #info .eyebrow { letter-spacing: .16em; }
 }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="stripe" style="top:0"><i></i><i></i><i></i></div>
<div class="stripe" style="bottom:0"><i></i><i></i><i></i></div>
<div id="hole" class="panel">
  <div class="roundel display">LDC</div>
  <div><div class="name display">Long Drive Club</div><div class="eyebrow"><span id="holeLabel"></span> · <span id="strokes">0</span></div><button id="holesBtn">Holes</button></div>
</div>
<div id="start" class="panel" role="dialog" aria-label="Ambiance">
  <div class="stripe"><i></i><i></i><i></i></div>
  <div class="roundel display">LDC</div>
  <h2 class="display">Long Drive Club</h2>
  <div class="eyebrow">Choose your ambiance</div>
  <div id="skies"></div>
  <button id="play">Done</button>
</div>
<div id="card" class="panel" role="dialog" aria-label="Holes">
  <div class="stripe"><i></i><i></i><i></i></div>
  <div class="cardBtns"><button id="resume">Back to round</button><button id="scBtn">Scorecard</button><button id="newRound">New round</button><button id="lightBtn">Ambiance</button><button id="soundBtn">Sound on</button><button id="cardClose">Close</button></div>
  <div id="cardAsk" hidden><span id="askText"></span><div class="cardBtns"><button id="askYes">Yes</button><button id="askNo">Cancel</button></div></div>
  <div id="cardTotal" class="eyebrow"></div>
  <div class="hrow head eyebrow"><span>No</span><span>Hole</span><span>Par</span><span>Yd</span><span>SI</span><span>Score</span></div>
  <div id="cardRows"></div>
</div>
<div id="scrim"></div>
<div id="sc" class="panel" role="dialog" aria-label="Scorecard">
  <div class="stripe"><i></i><i></i><i></i></div>
  <div class="scHead"><div class="roundel display">LDC</div><div><div class="eyebrow">Long Drive Club</div><h2 class="display">Scorecard</h2><div class="eyebrow" id="scDate"></div></div></div>
  <div class="scWrap"><table id="scFront"></table></div>
  <div class="scWrap"><table id="scBack"></table></div>
  <div class="scTotal"><span class="display" id="scScore"></span><span class="voice" id="scPar"></span></div>
  <div class="scKey eyebrow"><i class="m b"></i>Birdie <i class="m e"></i>Eagle <i class="m o"></i>Bogey <i class="m d"></i>Double +</div>
  <div id="scBoard"></div>
  <form id="scForm" hidden>
    <label class="eyebrow" for="scName">Name on the board</label><input id="scName" maxlength="24" autocomplete="nickname" required>
    <label class="eyebrow" for="scEmail">Email (optional, never shown)</label><input id="scEmail" type="email" maxlength="120" autocomplete="email">
    <button id="scSend">Hand in card</button>
  </form>
  <p id="scMsg" class="voice" hidden></p>
  <div class="scBtns"><button id="scSubmit">Submit score</button><button id="scView">View leaderboard</button><button id="scSave">Save image</button><button id="scAgain">Go round again</button><button id="scClose">Back to round</button></div>
</div>
<div id="info" class="panel">
  <div><span id="dist" class="num display">0</span> <span class="eyebrow" id="distUnit">yd to pin</span></div>
  <div class="row2"><span id="windMph" class="num display">0</span><span class="eyebrow">mph</span><span id="wind">➤</span></div>
  <div id="aimRead" class="eyebrow">At pin aim</div>
  <div id="stats"></div>
</div>
<div id="toast" class="display"></div>
<div id="done" class="panel">
  <div class="stripe"><i></i><i></i><i></i></div>
  <div class="roundel display" id="doneScore">0</div>
  <h2 id="doneTitle" class="display"></h2>
  <div id="doneSub" class="eyebrow"></div>
  <button id="again">Play again</button> <button id="next">Next hole</button>
</div>
<div id="water" class="panel" role="dialog" aria-label="Water">
  <div class="stripe"><i></i><i></i><i></i></div>
  <h2 class="display">Water</h2>
  <p class="voice">One stroke. Your call where you play the next.</p>
  <button id="wReplay">Replay from last spot</button> <button id="wDrop">Drop zone</button>
</div>
<div id="controls">
  <div id="bag" role="dialog" aria-label="Choose a club"><div class="eyebrow">Choose a club</div><div class="grid"></div></div>
  <div class="row"><button id="club" aria-haspopup="dialog" aria-expanded="false"></button><button id="swing">Swing</button></div>
  <div id="power" role="slider" aria-label="Power"><div id="powerFill"></div><div id="powerText" class="display"></div></div>
  <div id="hint" class="eyebrow">Set the power · swing</div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ---------- vectors ----------
const v = (x, y, z) => ({ x, y, z });
const add = (a, b) => v(a.x + b.x, a.y + b.y, a.z + b.z);

  const back = putting ? 3.2 : 10, up = putting ? 1.3 : 3.8; // putting sits low and close: ball and cup are drawn true size
  const cx = ball.x - Math.sin(aim) * back, cz = ball.z - Math.cos(aim) * back;
  const target = new THREE.Vector3(cx, Math.max(ball.y + up, heightAt(cx, cz) + 1.5), cz);
  // always look ahead along the line, so the view doesn't snap between "down the fairway" and "at the ball"
  // aim point a few metres past the ball puts the ball ~60% down the screen, clear of the controls (55° vertical FOV)
  const ahead = putting ? 1.6 : 5.6;
  const look = new THREE.Vector3(ball.x + Math.sin(aim) * ahead, ball.y, ball.z + Math.cos(aim) * ahead);
  camPos.lerp(target, 0.08); camLook.lerp(look, 0.12);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(ball.x + LIGHT.dir.x * 250, ball.y + LIGHT.dir.y * 250, ball.z + LIGHT.dir.z * 250); sun.target.position.set(ball.x, ball.y, ball.z);
  sky.position.copy(camera.position); sky.material.uniforms.time.value = now / 1000;
  if (greenLines.visible) greenLines.tick(now);
  cloth.rotation.y = HOLE.wind.toward_deg * Math.PI / 180 - Math.PI / 2 + Math.sin(now / 300) * 0.1;
  { const a = clothGeo.attributes.position, flap = .02 + HOLE.wind.mph * .003; // ripple grows toward the free edge and with the wind
    for (let i = 0; i < a.count; i++) { const x = clothX[i * 3]; a.setZ(i, Math.sin(x * 9 - now / 140) * flap * x / .8); }
    a.needsUpdate = true; clothGeo.computeVertexNormals(); }
  renderer.render(scene, camera);
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  // portrait phones: widen the view (up to 80°) so it isn't a narrow slit; landscape/desktop stay at the signed-off 55°
  camera.fov = Math.max(55, Math.min(80, 2 * Math.atan(Math.tan(Math.PI / 6) / camera.aspect) * 180 / Math.PI));
  camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
reset();
camPos.set(state.ball.x, state.ball.y + 4, state.ball.z - 12); camLook.set(PIN.x, 0, PIN.z);
requestAnimationFrame(frame);
</script>
</body>
